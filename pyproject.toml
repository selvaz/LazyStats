[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazystats"
version = "0.1.0"
description = "Pure statistical library of the LazyBridge ecosystem — core statistics, models and hub-backed I/O. No lazybridge, no LLM wrapping (that lives in LazyTools)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LazyBridge Labs" }]
# ZERO hard runtime dependencies by design (plan v3.1 Fase 6): the core is
# stdlib-only. Optional integrations are imported lazily:
#   - io/datahub.py needs market-data-hub (private git package — deliberately
#     NOT a PyPI extra, same dependency-confusion rationale as the siblings);
#   - io/local.py optionally uses pandas when handed a DataFrame.
dependencies = []

[project.optional-dependencies]
# lazystats.regimes — the LazyHMM engines migrated here (plan v3.1 Fase 6
# step 3). The rest of the library stays dependency-free: nothing outside
# regimes/ imports these, and `import lazystats` never pulls them.
regimes = [
    "numpy>=1.24",
    "pandas>=1.5",
    "matplotlib>=3.5",
    "hmmlearn>=0.3",
    "scikit-learn>=1.1",
]
test = ["lazystats[regimes]", "pytest>=8.2", "pytest-cov>=5.0"]
dev = ["lazystats[test]", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/lazystats"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# regimes/ (and its ported tests) is LazyHMM migrated verbatim — equivalence
# before style (plan v3.1). Only correctness rules run there; the full rule
# set applies once the follow-up cleanup lands.
[tool.ruff.lint.per-file-ignores]
"src/lazystats/regimes/**" = ["E", "I", "UP", "B"]
"tests/regimes/**" = ["E", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["lazystats"]
strict = true
ignore_missing_imports = true

# regimes/ is LazyHMM's code migrated verbatim (equivalence first — plan v3.1:
# stessa output numerico). It predates this repo's strict typing; tightening
# its annotations is follow-up work, not part of the migration.
[[tool.mypy.overrides]]
module = "lazystats.regimes.*"
strict = false
ignore_errors = true
