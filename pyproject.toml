[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazystats"
version = "0.2.0"
description = "Pure statistical library of the LazyBridge ecosystem — core statistics, models and hub-backed I/O. No lazybridge, no LLM wrapping (that lives in LazyTools)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LazyBridge Labs" }]
# ZERO hard runtime dependencies by design (plan v3.1 Fase 6): the core is
# stdlib-only. Optional integrations are imported lazily:
#   - io/datahub.py needs market-data-hub (private git package — deliberately
#     NOT a PyPI extra, same dependency-confusion rationale as the siblings);
#   - io/local.py optionally uses pandas when handed a DataFrame.
dependencies = []

[project.optional-dependencies]
# Registers this repo's result depot as a Source (lazystats.dataspace_source)
# so a cross-repository workflow can check every source's readiness together
# before it starts writing. The distribution is `lazydataspace`, not
# `dataspace` -- that name belongs to an unrelated project on PyPI. Optional
# on purpose: nothing else in the package imports it, so the repo installs
# and runs standalone without it, and a test enforces that.
lazydataspace = [
    "lazydataspace @ git+https://github.com/selvaz/DataSpace.git@4c2b71c2e59ea3e7e003d06e6b9b54354edea07e",
]
# lazystats.regimes — the LazyHMM engines migrated here (plan v3.1 Fase 6
# step 3). The rest of the library stays dependency-free: nothing outside
# regimes/ imports these, and `import lazystats` never pulls them.
regimes = [
    "numpy>=1.24",
    "pandas>=1.5",
    "matplotlib>=3.5",
    "hmmlearn>=0.3",
    "scikit-learn>=1.1",
]
# lazystats.regression — OLS/Ridge/Lasso wrappers over statsmodels and
# scikit-learn. Imported lazily inside function bodies: `import lazystats`
# and even `import lazystats.regression` stay dependency-free until a fit
# function actually runs.
regression = [
    "numpy>=1.24",
    "statsmodels>=0.14",
    "scikit-learn>=1.1",
]
# lazystats.weekly_anomaly — the review's three contracts are pydantic models,
# so validating an agent's structured output is the model itself rather than a
# hand-written checker that would drift from it. Optional like the two above:
# nothing else imports pydantic, `import lazystats` never pulls it, and the
# core stays dependency-free.
review = ["pydantic>=2"]

test = ["lazystats[regimes]", "lazystats[regression]", "lazystats[review]",
        "pytest>=8.2", "pytest-cov>=5.0"]
dev = ["lazystats[test]", "ruff>=0.6", "mypy>=1.10"]
# Ecosystem contract tests (stabilization plan, ECO-010 / Train B PR B3):
# validates lazystats.models.ReturnDataset against market-data-hub's
# contracts/v1/*.json fixtures. Pinned to an immutable commit -- same
# dependency-confusion rationale as the datahub.py runtime import (not a
# PyPI extra, market-data-hub is not on PyPI). Opt-in: the default test
# suite skips these tests when market-data-hub isn't installed.
contract = ["market-data-hub @ git+https://github.com/selvaz/market-data-hub.git@f4a0a29e4d5d1e712926bb848f022f5c2756664a"]

[tool.hatch.metadata]
# Required for the `contract` extra's direct Git reference: market-data-hub
# is not on PyPI (private/proprietary, GitHub-only distribution).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/lazystats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A developer may have another LazyStats worktree installed editable. Tests
# must exercise this checkout, not whichever checkout the environment points
# at. Keep this declarative; individual tests must not rewrite sys.path.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# regimes/ (and its ported tests) is LazyHMM migrated verbatim — equivalence
# before style (plan v3.1). Only correctness rules run there; the full rule
# set applies once the follow-up cleanup lands.
# weekly_review_report.py is the production renderer moved here unchanged.
# Its long lines are HTML and JavaScript inside a template string; reflowing
# them would be an unreviewable diff in the one file whose rendered output a
# comparison checks. Only the line-length rule is relaxed, and only here —
# every correctness rule still applies. Same shape as the regimes exemption
# below: equivalence before style, for a verbatim migration.
[tool.ruff.lint.per-file-ignores]
"src/lazystats/regimes/**" = ["E", "I", "UP", "B"]
"tests/regimes/**" = ["E", "I", "UP", "B"]
"src/lazystats/weekly_review_report.py" = ["E501"]

[tool.mypy]
# No explicit python_version: mypy assumes the interpreter actually running
# it. Pinning 3.11 broke the 3.12/3.13 CI legs — numpy's bundled stubs use
# the `type` statement (3.12+ syntax), unparseable under a lower target.
# Same rationale as market-data-hub's mypy config.
packages = ["lazystats"]
strict = true
ignore_missing_imports = true

# regimes/ is LazyHMM's code migrated verbatim (equivalence first — plan v3.1:
# stessa output numerico). It predates this repo's strict typing; tightening
# its annotations is follow-up work, not part of the migration.
[[tool.mypy.overrides]]
module = "lazystats.regimes.*"
strict = false
ignore_errors = true
